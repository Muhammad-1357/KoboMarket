services:
  api:
    build: .
    command: sh -c "npm run migrate:latest && npm run dev"
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/kobomarket
      DATABASE_URL: postgres://kobomarket:kobomarket@postgres:5432/kobomarket
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo_data:/data/db
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kobomarket
      POSTGRES_USER: kobomarket
      POSTGRES_PASSWORD: kobomarket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kobomarket -d kobomarket"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  mongo_data:
  postgres_data:
